# SonarQube configuration for Salesforce Apex
sonar.projectKey=salesforce-test
sonar.projectName=salesforce-test
sonar.projectVersion=1.0

# Apex source (Salesforce CLI can convert to temp dir; or point to force-app)
sonar.sources=force-app/main/default/classes
sonar.sourceEncoding=UTF-8

# Exclude meta.xml and test classes from duplication if desired (optional)
sonar.apex.exclusions=**/*Test.cls,**/*.cls-meta.xml

# Test files (for coverage reporting if your SonarQube has Apex plugin)
sonar.tests=force-app/main/default/classes
sonar.apex.test.exclusions=**/*Test.cls

# Optional: server URL and token (override via env or command line)
# sonar.host.url=http://localhost:9000
# sonar.token=your-token
